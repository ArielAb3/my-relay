<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#122539"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="שולחן מרוחק">
<title>שולחן מרוחק</title><link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.png"><link rel="icon" href="./icon.png">
<link rel="stylesheet" href="./app.css"><script defer src="./viewer.js"></script></head>
<body><main>
<header><img src="./icon.png" alt="" width="42" height="42"><h1>שולחן מרוחק</h1><button id="end" class="secondary" hidden>ניתוק</button></header>
<section id="login"><h2>חיבור למחשב</h2><form id="credentials">
<label for="code">קוד המחשב</label><input id="code" dir="ltr" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="off">
<label for="pass">סיסמת הגישה</label><input id="pass" type="password" minlength="16" maxlength="128" required dir="auto" autocomplete="off">
<button id="join" type="submit">בקשת חיבור</button></form>
<details><summary>הוספה למסך הבית באייפון</summary><p>ב־Safari בחרו ״שיתוף״, ואז ״הוספה למסך הבית״ ו״הוסף״.</p></details></section>
<p id="status" role="status" aria-live="polite"></p>
<section id="viewer" hidden aria-label="המסך המשותף"><canvas id="screen" width="1" height="1" aria-label="המסך המרוחק. הקשה ללחיצה וגרירה להזזה עם לחצן לחוץ"></canvas>
<div class="tools"><button class="secondary" id="keyboard" aria-expanded="false">מקלדת</button><button class="secondary" id="right">לחיצה ימנית</button>
<button class="secondary" id="up" aria-label="גלילה למעלה">גלילה ↑</button><button class="secondary" id="down" aria-label="גלילה למטה">גלילה ↓</button></div>
<form id="typing" hidden><label for="entry">טקסט למחשב</label><input id="entry" type="text" dir="auto" maxlength="256" autocomplete="off">
<div class="tools"><button>שליחה</button><button type="button" class="secondary" id="enter">Enter</button><button type="button" class="secondary" id="back">⌫</button></div></form></section>
</main></body></html>
